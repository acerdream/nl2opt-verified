[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nl2opt"
version = "0.1.0"
description = "自然语言线性/整数规划问题 → 可运行、可验证、可迭代修复的求解模型与代码（理解-建模-生成-执行-验证-反思-重写闭环）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "nl2opt" }]
keywords = ["nlp", "optimization", "linear-programming", "milp", "llm-agent"]
dependencies = [
    "pydantic>=2.5",
    "PyYAML>=6.0",
    "httpx>=0.25",
    "scipy>=1.11",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nl2opt = "nl2opt.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
